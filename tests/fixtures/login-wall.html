<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login • Instagram</title>
</head>
<body>
  <div id="root">
    <div class="login-box">
      <h1>Instagram</h1>
      <form>
        <input type="text" placeholder="Phone number, username, or email">
        <input type="password" placeholder="Password">
        <button type="submit">Log In</button>
      </form>
      <p>Log in to Instagram to view this profile.</p>
    </div>
  </div>
</body>
</html>
