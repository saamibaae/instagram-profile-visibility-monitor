services:
  instagram-monitor:
    build: .
    container_name: instagram-visibility-monitor
    restart: unless-stopped
    init: true
    ports:
      - "3847:3847"
    environment:
      - TARGET_USERNAME=${TARGET_USERNAME:-instagram}
      - SCHEDULE_MODE=${SCHEDULE_MODE:-FIXED}
      - FIXED_INTERVAL_MINUTES=${FIXED_INTERVAL_MINUTES:-3}
      - RANDOM_MIN_SECONDS=${RANDOM_MIN_SECONDS:-60}
      - RANDOM_MAX_SECONDS=${RANDOM_MAX_SECONDS:-180}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - PROXY_URL=${PROXY_URL:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - TELEGRAM_NOTIFICATIONS_ENABLED=${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_TWO_WAY_ENABLED=${TELEGRAM_TWO_WAY_ENABLED:-true}
      - CONSECUTIVE_UNKNOWN_ALERT_THRESHOLD=${CONSECUTIVE_UNKNOWN_ALERT_THRESHOLD:-5}
      - HEADLESS=true
      - EPHEMERAL_BROWSER=true
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 150M
